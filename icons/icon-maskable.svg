<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26324a"/>
      <stop offset="1" stop-color="#151b28"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
  
  <!-- film strip edges -->
  <g fill="#3a4866">
    <rect x="76" y="104" width="360" height="22" rx="6"/>
    <rect x="76" y="386" width="360" height="22" rx="6"/>
  </g>
  <g fill="#151b28">
    <rect x="96"  y="110" width="26" height="10" rx="3"/>
    <rect x="152" y="110" width="26" height="10" rx="3"/>
    <rect x="208" y="110" width="26" height="10" rx="3"/>
    <rect x="264" y="110" width="26" height="10" rx="3"/>
    <rect x="320" y="110" width="26" height="10" rx="3"/>
    <rect x="376" y="110" width="26" height="10" rx="3"/>
    <rect x="96"  y="392" width="26" height="10" rx="3"/>
    <rect x="152" y="392" width="26" height="10" rx="3"/>
    <rect x="208" y="392" width="26" height="10" rx="3"/>
    <rect x="264" y="392" width="26" height="10" rx="3"/>
    <rect x="320" y="392" width="26" height="10" rx="3"/>
    <rect x="376" y="392" width="26" height="10" rx="3"/>
  </g>
  <!-- play triangle, split by a diagonal cut -->
  <clipPath id="left"><polygon points="0,0 262,0 222,512 0,512"/></clipPath>
  <clipPath id="right"><polygon points="282,0 512,0 512,512 242,512"/></clipPath>
  <g clip-path="url(#left)">
    <path d="M190 166 L370 256 L190 346 Z" fill="url(#play)" stroke="url(#play)" stroke-width="22" stroke-linejoin="round"/>
  </g>
  <g clip-path="url(#right)" transform="translate(10 0)">
    <path d="M190 166 L370 256 L190 346 Z" fill="url(#play)" stroke="url(#play)" stroke-width="22" stroke-linejoin="round"/>
  </g>

</g>
</svg>
